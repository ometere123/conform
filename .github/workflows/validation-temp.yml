name: temporary-conform-validation

on:
  push:
    branches:
      - work/deploy-validation-2026-08-17

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      GENVM_VERSION: v0.3.0-rc7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install current official test tooling
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install --upgrade 'git+https://github.com/genlayerlabs/genlayer-testing-suite.git@main'
      - name: Show installed versions
        run: |
          python -m pip show genlayer-test | grep -E '^(Name|Version):'
          python -c "from gltest.direct import sdk_loader; print('GENVM_VERSION=', sdk_loader.resolve_version()); print('assets=', sdk_loader.RUNNER_BUNDLE_ASSETS)"
      - name: Isolate Direct Mode loader behavior
        continue-on-error: true
        run: pytest validation/test_loader_smoke.py -v
      - name: Run SDK-free deterministic checks
        continue-on-error: true
        run: python scripts/test_deterministic.py
      - name: Run Conform Direct Mode tests without genvm-lint
        continue-on-error: true
        run: pytest tests/ -v
