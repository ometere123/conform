name: temporary-conform-validation

on:
  push:
    branches:
      - work/deploy-validation-2026-08-17

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test tooling
        run: python -m pip install --upgrade pip genlayer-test pytest
      - name: Run SDK-free deterministic checks
        continue-on-error: true
        run: python scripts/test_deterministic.py
      - name: Run Direct Mode tests without genvm-lint
        run: pytest tests/ -v
