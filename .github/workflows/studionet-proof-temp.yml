name: temporary-studionet-proof

on:
  push:
    branches:
      - work/final-studionet-proof-2026-08-17
    paths-ignore:
      - validation/studionet-proof.log
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install current official GenLayer test tooling
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install --upgrade 'git+https://github.com/genlayerlabs/genlayer-testing-suite.git@main'
      - name: Show network configuration
        run: |
          cat gltest.config.yaml
          python -m pip show genlayer-test | grep -E '^(Name|Version):'
      - name: Run final Conform Studionet proof
        id: proof
        shell: bash
        run: |
          set -o pipefail
          gltest --network studionet --default-wait-retries 90 --default-wait-interval 2000 validation/test_studionet_deploy.py -v -s 2>&1 | tee validation/studionet-proof.log
      - name: Persist temporary proof log on proof branch
        if: always()
        shell: bash
        run: |
          test -f validation/studionet-proof.log || printf '%s\n' 'Proof command did not produce a log.' > validation/studionet-proof.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/studionet-proof.log
          if git diff --cached --quiet; then
            echo 'No proof log change to commit.'
          else
            git commit -m 'chore: record temporary Studionet proof result'
            git push origin HEAD:work/final-studionet-proof-2026-08-17
          fi
