name: temporary Conform final runtime proof

on:
  push:
    branches: [work/conform-final-runtime]

jobs:
  direct-mode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - run: git diff --check
      - run: python -m py_compile contracts/conform.py
      - run: python scripts/test_deterministic.py
      - run: |
          mkdir -p "$HOME/.cache/gltest-direct"
          curl --fail --location https://github.com/genlayerlabs/genvm/releases/download/v0.2.12/genvm-universal.tar.xz --output "$HOME/.cache/gltest-direct/genvm-universal-v0.2.12.tar.xz"
      - run: python -m pytest tests/test_conform.py -q

  studionet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Single passive audit lifecycle
        run: python -m pytest tests/integration/test_conform_studionet.py -q -s --network studionet
