name: temporary Conform Ubuntu proof

on:
  push:
    branches: [work/conform-final-runtime]
  workflow_dispatch:

jobs:
  direct-mode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official GenLayer test tooling
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Check whitespace
        run: git diff --check
      - name: Compile contract
        run: python -m py_compile contracts/conform.py
      - name: Deterministic helpers
        run: python scripts/test_deterministic.py
      - name: Direct Mode suite
        run: python -m pytest -q

  studionet:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official GenLayer test tooling
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Run final-source Studionet integration
        run: python -m pytest -q tests/integration/test_conform_studionet.py --network studionet -s
