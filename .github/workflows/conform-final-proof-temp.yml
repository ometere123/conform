name: temporary Conform final proof

on:
  push:
    branches: [work/conform-final-runtime]

jobs:
  direct-mode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - run: git diff --check
      - run: python -m py_compile contracts/conform.py
      - run: python scripts/test_deterministic.py
      - name: Seed compatible cached GenVM artifact
        run: |
          mkdir -p "$HOME/.cache/gltest-direct"
          curl --fail --location \
            https://github.com/genlayerlabs/genvm/releases/download/v0.2.12/genvm-universal.tar.xz \
            --output "$HOME/.cache/gltest-direct/genvm-universal-v0.2.12.tar.xz"
      - name: Conform Direct Mode only
        run: python -m pytest tests/test_conform.py -q

  studionet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Final-source Studionet integration only
        run: python -m pytest tests/integration/test_conform_studionet.py::test_final_source_can_deploy_and_register_on_studionet --network studionet -q -s
      - name: Passive GET audit and reads
        run: python -m pytest tests/integration/test_conform_studionet.py::test_passive_get_audit_and_reads_on_studionet --network studionet -q -s
      - name: Freshness proof
        run: python -m pytest tests/integration/test_conform_studionet.py::test_definition_freshness_on_studionet --network studionet -q -s
      - name: Harmless POST owner proof
        run: python -m pytest tests/integration/test_conform_studionet.py::test_owner_can_audit_harmless_post_profile_on_studionet --network studionet -q -s
